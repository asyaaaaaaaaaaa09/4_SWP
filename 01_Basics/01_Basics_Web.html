<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSUEBUNGENasya</title>
    <style>
        /* gilt für alle div elemente*/
        div {
            background-color: wheat;
            /*Hintergrundsfarbe der Schrift*/
            color: olive;
            /*farbe der Schrift*/
            border-style: solid;
        }

        /*erstellung der Klasse header*/
        .header {
            font-size: 2rem;
            /*alles mit dieser Klasse bekommt diese größe*/
        }
    </style>
</head>

<body>
    <!--ein div mit der einer klasse (header)-->
    <div class="header"> HEYYY!</div>
    <div>
        <!-- h1 = heading1 je größer die Zahl deste kleiner die schrift-->
        <h1> Hello, Asya!</h1>
        <p>This is a HTML page</p>
    </div>
</body>


</html>
