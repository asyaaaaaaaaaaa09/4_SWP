<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS HTML Test</title>
    <style>
        body {
            margin: 0;
        }

        .box-oben {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 50px;
            height: 50px;
            background: purple;
        }

        .blau {
            position: relative;
            width: 400px;
            height: 300px;
            margin: 20px 0 50px 20px;
            padding: 20px 0 0 20px;
            background: aqua;
        }


        .braun {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 100px;
            height: 100px;
            background: brown;
        }

        .leiste {
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: 50px 120px 30px 0;
            background: yellow;
            gap: 5px;
            top: 0;
            position: sticky;

        }

        .box {
            width: 30px;
            height: 30px;
            background: green;
        }
    </style>
</head>

<body>
    <div class="leiste">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="box-oben"></div>

    <div class="blau">
        <div class="braun"></div>
    </div>



</body>

</html>
